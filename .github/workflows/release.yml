name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows 7 compatible watchdog
        run: npm run watchdog:build

      - name: Validate release contracts
        run: npm run validate

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild --force --arch=x64 --version=40.6.0

      - name: Build frontend
        run: npm run build

      - name: Validate renderer build
        run: npm run validate:renderer

      - name: Package Electron app without publishing
        run: npx electron-builder --config electron-builder.config.cjs --dir

      - name: Restore Node native modules for source validation
        run: npm rebuild better-sqlite3

      - name: Validate packaged files
        run: npm run validate:asar

      - name: Smoke test packaged native modules
        run: npm run validate:native

      - name: Build installer and publish verified package
        run: npx electron-builder --config electron-builder.config.cjs --prepackaged release/win-unpacked --publish never

      - name: Publish verified package in one release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            release/latest.yml `
            release/*.exe `
            release/*.blockmap `
            --title "$env:GITHUB_REF_NAME" `
            --draft `
            --generate-notes

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*.exe
